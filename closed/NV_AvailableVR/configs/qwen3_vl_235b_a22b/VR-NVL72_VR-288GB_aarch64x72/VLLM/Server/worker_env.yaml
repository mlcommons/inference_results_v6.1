DYN_LOG: error
VLLM_LOGGING_LEVEL: INFO
VLLM_USE_FLASHINFER_SAMPLER: 1
VLLM_FLASHINFER_WORKSPACE_BUFFER_SIZE: 1610612736
TOKIO_WORKER_THREADS: 32
OMP_NUM_THREADS: 64
DYN_REQUEST_PLANE: tcp
DYN_TCP_REQUEST_TIMEOUT: 120
DYN_TCP_CONNECT_TIMEOUT: 20
DYN_TCP_POOL_SIZE: 512
DYN_TCP_CHANNEL_BUFFER: 1024

# cuDNN 9.26 ships in the image (pip nvidia-cudnn-cu13 9.26.0.51); no LD_LIBRARY_PATH override.
PYTORCH_SKIP_CUDNN_COMPATIBILITY_CHECK: 1

# Rubin CuTe-DSL attention (all default off in vLLM): ViT FMHA with the persistent kernel,
# and paged GQA prefill with the tuned per-batch policy. The tuned exports are baked in
# FlashInfer's pinned cute-dsl artifact collection (flashinfer_cubin/cubins/<pin>/fmha/cute-dsl/);
# do not set FLASHINFER_DSL_FMHA_LOCAL_DIR.
VLLM_RUBIN_CUTEDSL_VIT: 1
VLLM_RUBIN_CUTEDSL_VIT_PERSISTENT: 1
VLLM_RUBIN_CUTEDSL_PREFILL: 1
VLLM_RUBIN_CUTEDSL_PREFILL_POLICY: tuned

# Empty = autotune every FlashInfer op, including the nvfp4 GEMMs FlashInfer skips by default.
VLLM_FLASHINFER_AUTOTUNE_SKIP_OPS: ""
