# inference-endpoint config — VRx72 Q3VL Server perf run (online, poisson, target_qps=1850).

name: "online-qwen3-vl-235b-a22b-shopify-benchmark"
version: "1.0"
type: "online"
timeout: 14400

submission_ref:
  model: "qwen3-vl-235b-a22b"
  ruleset: "mlperf-inference-v6.1"

model_params:
  name: "${MODEL_NAME}"
  max_new_tokens: 150
  streaming: "on" # Required for TTFT/TPOT measurement

datasets:
  - name: shopify_product_catalogue::q3vl
    type: "performance"
  - name: shopify_product_catalogue::q3vl
    type: "accuracy"
    accuracy_config:
      eval_method: "shopify_category_f1"
      ground_truth: "ground_truth_category"
      extractor: "identity_extractor"
      num_repeats: 1

settings:
  # 7200 = TOTAL_GPUS (72) × per-instance (100).
  warmup:
    enabled: true
    n_requests: 7200
    drain: true

  runtime:
    min_duration_ms: 600000
    scheduler_random_seed: 42
    dataloader_random_seed: 42

  load_pattern:
    type: "poisson"
    target_qps: 2340

  client:
    num_workers: 8
    transport:
      type: zmq
      recv_buffer_size: 16777216
      send_buffer_size: 16777216
    max_connections: 16384
    worker_initialization_timeout: 120

  drain:
    warmup_timeout_s: 240.0 # Warmup drain timeout in seconds (None = wait indefinitely)
    performance_timeout_s: null # Performance drain timeout in seconds (None = wait indefinitely)
    accuracy_timeout_s: null # Accuracy drain timeout in seconds (None = wait indefinitely)

endpoint_config:
  endpoints:
    - "${FRONTEND_URL:-http://localhost:8000}"
  api_key: null

report_dir: log_collection/result_collection/hecate/VR/20260730-172002/qps_sweep/x72_server/confirmation/attempt_0_qps_2340_pinned_sflow_20260731-104457
