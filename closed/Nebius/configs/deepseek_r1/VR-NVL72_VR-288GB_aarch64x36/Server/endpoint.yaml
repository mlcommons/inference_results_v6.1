# DeepSeek-R1, Vera Rubin NVL72 half rack (36 GPUs), Server: MLPerf Endpoints client configuration.
name: dsr1-vr-server-dynamo-2c4g-x36
version: '1.0'
type: online
benchmark_mode: online
model_params:
  name: DeepSeek-R1-NVFP4-v2-mlpinf
  temperature: 0.0
  top_k: 1
  top_p: 1.0
  max_new_tokens: 20000
  min_new_tokens: 1
  skip_special_tokens: true
  streaming: 'on'
  tokenizer_name: ${MODEL_PATH}
datasets:
- name: dsr1-perf
  type: performance
  path: ${DATA_PATH}
- name: deepseek_r1_accuracy
  type: accuracy
  path: ${DATA_PATH}
  accuracy_config:
    eval_method: legacy_mlperf_deepseek_r1
    ground_truth: ground_truth
    num_repeats: 1
    extras:
      subset_column: dataset
      question_column: question
      tokenizer_path: ${MODEL_PATH}
settings:
  runtime:
    min_duration_ms: 1800000
    max_duration_ms: 3600000
    n_samples_to_issue: 386144
    scheduler_random_seed: 16159082839903944936
    dataloader_random_seed: 2747215439041700203
  load_pattern:
    type: poisson
    target_qps: 230.0
    use_legacy_loadgen_qps_metrics: true
  client:
    num_workers: 12
    log_level: INFO
    warmup_connections: -1
    auto_warmup_budget_fraction: 0.25
    max_concurrent_warmup_connects: 128
    max_connections: 60000
    transport:
      type: zmq
      recv_buffer_size: 16777216
      send_buffer_size: 16777216
      io_threads: 4
      worker_io_threads: 1
      high_water_mark: 0
      linger: -1
      immediate: 1
    stream_all_chunks: false
    worker_initialization_timeout: 300.0
    worker_graceful_shutdown_wait: 0.5
    worker_force_kill_timeout: 0.5
    insecure: false
    max_idle_time: 4.0
    min_required_connections: -1
    worker_gc_mode: relaxed
  drain:
    warmup_timeout_s: 240.0
    performance_timeout_s: null
    metrics_drain_timeout_s: 0.0
    metrics_tokenizer_workers: 2
  warmup:
    enabled: true
    n_requests: 32000
    salt: true
    drain: true
    warmup_random_seed: 42
  profiling: {}
  early_stopping:
    enabled: true
  service_ready_timeout_s: 30.0
endpoint_config:
  endpoints: []
  api_type: openai_completions
report_dir: ${SFLOW_TASK_OUTPUT_DIR}
verbose: false
enable_cpu_affinity: true
