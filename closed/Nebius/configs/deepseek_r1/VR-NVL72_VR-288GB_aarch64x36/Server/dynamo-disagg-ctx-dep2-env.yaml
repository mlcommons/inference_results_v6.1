# DeepSeek-R1, Vera Rubin NVL72 half rack (36 GPUs), Server: prefill (context) worker environment.
UCX_RNDV_SCHEME: put_zcopy
UCX_TLS: ^posix
UCX_CUDA_IPC_ENABLE_MNNVL: y
TLLM_NUMA_AWARE_WORKER_AFFINITY: '1'
TRTLLM_ENABLE_PDL: '1'
TRTLLM_SERVER_DISABLE_GC: '1'
TRTLLM_WORKER_DISABLE_GC: '1'
NCCL_GRAPH_MIXING_SUPPORT: '0'
TLLM_LOG_LEVEL: info
TRTLLM_FORCE_COMM_METHOD: PUSH_COMBINE
TRTLLM_PUSH_D0_FOLD: '1'
TRTLLM_PUSH_K4_V2: '1'
TRTLLM_PUSH_K23_PDL: '1'
TRTLLM_FP4_MLA_ATTENTION_BACKEND: cutedsl
TRTLLM_FP4_MLA_MXFP4_2D: '1'
TRTLLM_FP4_MLA_MXFP4_2D_SPLITKV: '1'
TRTLLM_FP4_MLA_MXFP4_2D_SPLITKV_MAX_QUERIES: '64'
PYTORCH_ALLOC_CONF: garbage_collection_threshold:0.97
TRTLLM_NVFP4_QUANTIZE_TRITON: '1'
TRTLLM_GREEDY_BF16_LOGITS: '1'
DYN_TCP_WORKER_POOL_SIZE: '20000'
